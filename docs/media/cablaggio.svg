<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1100" width="1600" height="1100" font-family="Helvetica, Arial, sans-serif">
  <title>Arrocco: schema dei collegamenti</title>
  <rect width="1600" height="1100" fill="#ffffff"/>

  <style>
    .t { font-size: 15px; fill: #111; }
    .ts { font-size: 12.5px; fill: #333; }
    .tw { font-size: 15px; fill: #fff; font-weight: 600; }
    .pl { font-size: 13px; fill: #fff; font-weight: 700; text-anchor: middle; }
    .pg { font-size: 12px; fill: #8a8a8a; text-anchor: middle; }
    .halo { fill: none; stroke: #fff; stroke-width: 9; stroke-linejoin: round; stroke-linecap: round; }
    .w { fill: none; stroke-width: 4.5; stroke-linejoin: round; stroke-linecap: round; }
    .pin { stroke: #fff; stroke-width: 2; }
  </style>

  <!-- titolo -->
  <text x="40" y="48" font-size="28" font-weight="700" fill="#111">Arrocco — collegamenti nella scocca</text>
  <text x="40" y="76" class="t">Montaggio con la scheda blu FTS02 e fili Dupont. Fori visti dal lato dello zoccolo del XIAO: in caso di dubbio vale la serigrafia sulla scheda.</text>

  <!-- ===== pannello ===== -->
  <rect x="420" y="110" width="760" height="110" rx="6" fill="#e9ecef" stroke="#888" stroke-width="2"/>
  <text x="800" y="160" text-anchor="middle" font-size="18" font-weight="700" fill="#222">Pannello e-ink 7,5" Good Display GDEY075T7-T01</text>
  <text x="800" y="186" text-anchor="middle" class="ts">display (flat 24 pin) + touch GT911 (flat 6 pin): i due flat escono dal lato lungo in basso</text>

  <!-- flat touch: dal pannello alla presa TP-FPC2 del FTS02 -->
  <path d="M480 220 V338" stroke="#c98a1b" stroke-width="10" fill="none"/>
  <text x="492" y="318" class="ts" fill="#8a5a00">flat touch 6 pin</text>
  <!-- flat display: dal pannello al connettore FPC della driver board -->
  <path d="M720 220 V460 H780" stroke="#c98a1b" stroke-width="30" fill="none" stroke-linejoin="round"/>
  <text x="660" y="490" class="ts" fill="#8a5a00">flat display 24 pin</text>
  <text x="660" y="506" class="ts" fill="#8a5a00">contatti verso l'alto</text>

  <!-- ===== FTS02 ===== -->
  <rect x="80" y="330" width="460" height="260" rx="8" fill="#1e4fb5"/>
  <rect x="440" y="338" width="80" height="24" rx="3" fill="#2b2b2b"/>
  <text x="480" y="378" class="pl" font-size="11.5">TP-FPC2 (P7)</text>
  <text x="310" y="440" class="tw" text-anchor="middle" font-size="18">Good Display ESP32-FTS02</text>
  <text x="310" y="464" class="tw" text-anchor="middle" font-size="13" font-weight="400">qui fa solo da adattatore per il flat del touch</text>
  <text x="310" y="484" class="tw" text-anchor="middle" font-size="13" font-weight="400">(flat inserito girato; presa e-paper e microSD vuote)</text>
  <text x="96" y="402" class="tw" font-size="12">P10</text>
  <text x="96" y="534" class="tw" font-size="12">P11</text>
  <!-- P10: A0 A3 A4 A5 A6 A7 -->
  <g>
    <circle cx="130" cy="350" r="8" fill="#1c9a4b" class="pin"/><text x="130" y="378" class="pl">A0</text>
    <circle cx="180" cy="350" r="8" fill="#8e44ad" class="pin"/><text x="180" y="378" class="pl">A3</text>
    <circle cx="230" cy="350" r="8" fill="#1f6fe0" class="pin"/><text x="230" y="378" class="pl">A4</text>
    <circle cx="280" cy="350" r="8" fill="#e8b400" class="pin"/><text x="280" y="378" class="pl">A5</text>
    <circle cx="330" cy="350" r="7" fill="#6b7fb8" class="pin"/><text x="330" y="378" class="pl" fill="#b9c6ea">A6</text>
    <circle cx="380" cy="350" r="7" fill="#6b7fb8" class="pin"/><text x="380" y="378" class="pl" fill="#b9c6ea">A7</text>
  </g>
  <!-- P11: 5V 3.3V 3.3V GND GND RESET A19 A18 -->
  <g>
    <circle cx="130" cy="570" r="8" fill="#6b7fb8" class="pin"/><text x="130" y="552" class="pl" fill="#ffb3b3">5V</text>
    <circle cx="180" cy="570" r="8" fill="#d62828" class="pin"/><text x="180" y="552" class="pl">3.3V</text>
    <circle cx="230" cy="570" r="7" fill="#6b7fb8" class="pin"/><text x="230" y="552" class="pl" fill="#b9c6ea">3.3V</text>
    <circle cx="280" cy="570" r="8" fill="#111" class="pin"/><text x="280" y="552" class="pl">GND</text>
    <circle cx="330" cy="570" r="8" fill="#111" class="pin"/><text x="330" y="552" class="pl">GND</text>
    <circle cx="380" cy="570" r="7" fill="#6b7fb8" class="pin"/><text x="380" y="552" class="pl" fill="#b9c6ea">RESET</text>
    <circle cx="430" cy="570" r="7" fill="#6b7fb8" class="pin"/><text x="430" y="552" class="pl" fill="#b9c6ea">A19</text>
    <circle cx="480" cy="570" r="7" fill="#6b7fb8" class="pin"/><text x="480" y="552" class="pl" fill="#b9c6ea">A18</text>
  </g>
  <!-- 5V del FTS02: vietato -->
  <path d="M122 562 L138 578 M138 562 L122 578" stroke="#ff3b3b" stroke-width="3.5"/>


  <!-- ===== driver board ===== -->
  <rect x="780" y="330" width="470" height="260" rx="8" fill="#1b1b1b"/>
  <rect x="770" y="420" width="22" height="80" rx="3" fill="#555"/>
  <text x="1015" y="400" class="tw" text-anchor="middle" font-size="16">Seeed ePaper Driver Board per XIAO</text>
  <rect x="870" y="420" width="330" height="96" rx="6" fill="#3a3a3a" stroke="#777"/>
  <text x="1035" y="462" class="tw" text-anchor="middle" font-size="17">XIAO ESP32-S3 Plus</text>
  <text x="1035" y="486" class="tw" text-anchor="middle" font-size="12.5" font-weight="400">nello zoccolo: USB-C dal lato opposto al flat</text>
  <rect x="1232" y="452" width="30" height="20" rx="4" fill="#c8c8c8" stroke="#666"/>
  <text x="1272" y="458" class="t" font-weight="700">USB-C</text>
  <text x="1272" y="476" class="ts">ricarica e</text>
  <text x="1272" y="492" class="ts">programmazione</text>
  <text x="1015" y="536" class="tw" text-anchor="middle" font-size="12" font-weight="400" fill="#ffd27a">interruttore ON/OFF della scheda: lasciarlo sempre su ON</text>
  <text x="808" y="430" class="pg" text-anchor="start" fill="#bbb">FPC</text>
  <!-- CN1: D6 D5 D4 DC BUSY CS RST -->
  <text x="790" y="346" class="tw" font-size="11">CN1</text>
  <g>
    <circle cx="830" cy="350" r="8" fill="#8e44ad" class="pin"/><text x="830" y="378" class="pl">D6</text>
    <circle cx="886" cy="350" r="8" fill="#e8b400" class="pin"/><text x="886" y="378" class="pl">D5</text>
    <circle cx="942" cy="350" r="8" fill="#1f6fe0" class="pin"/><text x="942" y="378" class="pl">D4</text>
    <circle cx="998" cy="350" r="7" fill="#555" class="pin"/><text x="998" y="378" class="pg">DC</text>
    <circle cx="1054" cy="350" r="7" fill="#555" class="pin"/><text x="1054" y="378" class="pg">BUSY</text>
    <circle cx="1110" cy="350" r="7" fill="#555" class="pin"/><text x="1110" y="378" class="pg">CS</text>
    <circle cx="1166" cy="350" r="7" fill="#555" class="pin"/><text x="1166" y="378" class="pg">RST</text>
  </g>
  <!-- CN2: D7 SCK D9 MOSI 3V3 GND 5V -->
  <text x="790" y="586" class="tw" font-size="11">CN2</text>
  <g>
    <circle cx="830" cy="570" r="8" fill="#f07c00" class="pin"/><text x="830" y="552" class="pl">D7</text>
    <circle cx="886" cy="570" r="7" fill="#555" class="pin"/><text x="886" y="552" class="pg">SCK</text>
    <circle cx="942" cy="570" r="8" fill="#1c9a4b" class="pin"/><text x="942" y="552" class="pl">D9</text>
    <circle cx="998" cy="570" r="7" fill="#555" class="pin"/><text x="998" y="552" class="pg">MOSI</text>
    <circle cx="1054" cy="570" r="8" fill="#d62828" class="pin"/><text x="1054" y="552" class="pl">3V3</text>
    <circle cx="1110" cy="570" r="8" fill="#111" class="pin"/><text x="1110" y="552" class="pl">GND</text>
    <circle cx="1166" cy="570" r="7" fill="#555" class="pin"/><text x="1166" y="552" class="pg" fill="#ff8a8a">5V</text>
  </g>
  <path d="M1158 562 L1174 578 M1174 562 L1158 578" stroke="#ff3b3b" stroke-width="3.5"/>


  <!-- presa batteria -->
  <rect x="1195" y="316" width="48" height="24" rx="3" fill="#f2f2f2" stroke="#999"/>
  <text x="1219" y="333" text-anchor="middle" font-size="11" font-weight="700" fill="#333">BAT</text>

  <!-- ===== batteria + interruttore KCD11 ===== -->
  <rect x="1340" y="110" width="230" height="140" rx="10" fill="#e6c229" stroke="#a88a10" stroke-width="2"/>
  <text x="1455" y="160" text-anchor="middle" font-size="17" font-weight="700" fill="#3a2f00">LiPo 606090</text>
  <text x="1455" y="184" text-anchor="middle" font-size="14" fill="#3a2f00">3,7 V · 4000 mAh</text>
  <text x="1455" y="206" text-anchor="middle" font-size="12" fill="#3a2f00">spina JST PH 2.0</text>

  <!-- ===== buzzer ===== -->
  <rect x="600" y="770" width="170" height="110" rx="8" fill="#111"/>
  <circle cx="685" cy="845" r="22" fill="#2a2a2a" stroke="#555"/>
  <text x="685" y="905" text-anchor="middle" class="t" font-weight="700">Buzzer KY-006</text>
  <circle cx="630" cy="790" r="8" fill="#f07c00" class="pin"/><text x="630" y="816" class="pl" font-size="12">S</text>
  <circle cx="685" cy="790" r="7" fill="#555" class="pin"/><text x="685" y="816" class="pg">nc</text>
  <circle cx="740" cy="790" r="8" fill="#111" stroke="#fff" stroke-width="2"/><text x="740" y="816" class="pl" font-size="12">−</text>

  <!-- ===== fili (prima l'alone bianco, poi il colore) ===== -->
  <g>
    <!-- D6 -> A3  RST touch -->
    <path class="halo" d="M830 350 V290 H180 V350"/><path class="w" stroke="#8e44ad" d="M830 350 V290 H180 V350"/>
    <!-- D5 -> A5  SCL -->
    <path class="halo" d="M886 350 V265 H280 V350"/><path class="w" stroke="#e8b400" d="M886 350 V265 H280 V350"/>
    <!-- D4 -> A4  SDA -->
    <path class="halo" d="M942 350 V240 H230 V350"/><path class="w" stroke="#1f6fe0" d="M942 350 V240 H230 V350"/>
    <!-- D9 -> A0  INT touch -->
    <path class="halo" d="M942 570 V660 H50 V215 H130 V350"/><path class="w" stroke="#1c9a4b" d="M942 570 V660 H50 V215 H130 V350"/>
    <!-- 3V3 -> 3.3V -->
    <path class="halo" d="M1054 570 V680 H180 V570"/><path class="w" stroke="#d62828" d="M1054 570 V680 H180 V570"/>
    <!-- GND -> GND -->
    <path class="halo" d="M1110 570 V700 H280 V570"/><path class="w" stroke="#111" d="M1110 570 V700 H280 V570"/>
    <!-- D7 -> buzzer S -->
    <path class="halo" d="M830 570 V640 H630 V790"/><path class="w" stroke="#f07c00" d="M830 570 V640 H630 V790"/>
    <!-- buzzer - -> secondo GND del FTS02 -->
    <path class="halo" d="M740 790 V720 H330 V570"/><path class="w" stroke="#111" d="M740 790 V720 H330 V570"/>
    <!-- batteria: + attraverso il KCD11, - diretto -->
    <path class="halo" d="M1380 250 V274 H1207 V316"/><path class="w" stroke="#d62828" d="M1380 250 V274 H1207 V316"/>
    <path class="halo" d="M1520 250 V306 H1231 V316"/><path class="w" stroke="#111" d="M1520 250 V306 H1231 V316"/>
  </g>
  <!-- interruttore KCD11 sul filo rosso -->
  <rect x="1262" y="258" width="72" height="32" rx="4" fill="#9e1b1b" stroke="#fff" stroke-width="2"/>
  <text x="1298" y="279" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">I / O</text>
  <text x="1260" y="372" class="t" font-weight="700" fill="#9e1b1b">Interruttore KCD11</text>
  <text x="1260" y="392" class="ts">sul fianco destro della scocca</text>
  <text x="1260" y="410" class="ts">cavetto JST PH 2.0 con interruttore:</text>
  <text x="1260" y="428" class="ts">interrompe il + della batteria</text>
  <path d="M1342 290 L1360 352" stroke="#9e1b1b" stroke-width="1.5" stroke-dasharray="4 3"/>

  <!-- ===== legenda ===== -->
  <g transform="translate(830,760)">
    <text x="0" y="0" class="t" font-weight="700">Fili (7 Dupont + batteria)</text>
    <g transform="translate(0,22)">
      <rect x="0" y="0" width="26" height="8" fill="#1f6fe0"/><text x="36" y="9" class="ts">D4 → A4 · SDA (touch, MAX17048)</text>
      <rect x="0" y="22" width="26" height="8" fill="#e8b400"/><text x="36" y="31" class="ts">D5 → A5 · SCL (touch, MAX17048)</text>
      <rect x="0" y="44" width="26" height="8" fill="#8e44ad"/><text x="36" y="53" class="ts">D6 → A3 · RST del touch</text>
      <rect x="0" y="66" width="26" height="8" fill="#1c9a4b"/><text x="36" y="75" class="ts">D9 → A0 · INT del touch (sveglia)</text>
      <rect x="0" y="88" width="26" height="8" fill="#f07c00"/><text x="36" y="97" class="ts">D7 → S del buzzer</text>
      <rect x="0" y="110" width="26" height="8" fill="#d62828"/><text x="36" y="119" class="ts">3V3 → 3.3V (alimentazione touch)</text>
      <rect x="0" y="132" width="26" height="8" fill="#111"/><text x="36" y="141" class="ts">GND → GND · buzzer − → secondo GND di P11</text>
    </g>
    <g transform="translate(390,22)">
      <text x="0" y="9" class="ts">• Display: nessun filo, solo il flat a 24 pin.</text>
      <text x="0" y="31" class="ts">• Accensione: interruttore KCD11 sul fianco.</text>
      <text x="0" y="53" class="ts">• Per caricare: KCD11 su ON + USB-C.</text>
      <text x="0" y="75" class="ts">• MAX17048 (se c'è): + e − sui pad del retro</text>
      <text x="0" y="93" class="ts">   della driver board, SDA su D4, SCL su D5.</text>
      <text x="0" y="115" class="ts">• Si collega tutto a scheda spenta.</text>
      <text x="0" y="137" class="ts">• Polarità della batteria: misurala prima.</text>
      <text x="0" y="163" class="ts">• Pin grigi: del display (già collegati) o liberi.</text>
      <text x="0" y="185" class="ts" fill="#b00000">• ✕ rossa: 5V, mai collegarlo.</text>
    </g>
  </g>
  <text x="40" y="1070" class="ts" fill="#777">Pin map completa e procedure: docs/wiring.md · CollectiCraft · GPL-3.0-or-later</text>
</svg>
