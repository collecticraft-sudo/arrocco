; Arrocco - e-ink chess
;
; arrocco = the game firmware, sources in src/app/ + lib/arrocco (the portable core)
; hwtest  = hardware-validation firmware, sources in src/hwtest/
; Both share the drivers in src/common/ (panel, touch, gauge, I2C, log, config).

[platformio]
default_envs = arrocco

; Everything the two environments have in common: [env] is the base of every [env:*].
[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.38-1/platform-espressif32.zip
; NOT seeed_xiao_esp32s3: that one writes an 8 MB flash header and web-flashed
; devices boot-loop. The _plus board JSON already sets BOARD_HAS_PSRAM,
; ARDUINO_USB_CDC_ON_BOOT=1 and memory_type qio_opi.
board = seeed_xiao_esp32_s3_plus
framework = arduino
board_build.partitions = default_16MB.csv
lib_deps =
    zinggjm/GxEPD2 @ 1.6.9
    adafruit/Adafruit GFX Library @ 1.12.6
build_flags = -DCORE_DEBUG_LEVEL=2
; Our own sources only: warnings, and -Isrc/common so that both trees include the
; shared drivers by bare name. Not in build_flags: the libraries must not see a
; directory holding config.h, log.h and panel.h.
build_src_flags = -Wall -Wextra -Isrc/common
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time

[env:arrocco]
build_src_filter = +<common/> +<app/>

[env:hwtest]
build_src_filter = +<common/> +<hwtest/>
lib_ignore = arrocco
