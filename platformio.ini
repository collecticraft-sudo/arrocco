; Arrocco - e-ink chess
;
; hwtest  = hardware-validation firmware, sources in src/hwtest/
; (the game firmware will get its own [env:arrocco] with sources in src/app/)

[platformio]
default_envs = hwtest

[env:hwtest]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.38-1/platform-espressif32.zip
; NOT seeed_xiao_esp32s3: that one writes an 8 MB flash header and web-flashed
; devices boot-loop. The _plus board JSON already sets BOARD_HAS_PSRAM,
; ARDUINO_USB_CDC_ON_BOOT=1 and memory_type qio_opi.
board = seeed_xiao_esp32_s3_plus
framework = arduino
board_build.partitions = default_16MB.csv
build_src_filter = +<hwtest/>
lib_ignore = arrocco
lib_deps =
    zinggjm/GxEPD2 @ 1.6.9
    adafruit/Adafruit GFX Library @ 1.12.6
build_flags = -DCORE_DEBUG_LEVEL=2
; warnings for our own sources only
build_src_flags = -Wall -Wextra
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
